button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--thumb);border:3px solid transparent;background-clip:padding-box;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.tn{font-variant-numeric:tabular-nums}

/* 버튼 */
button{cursor:pointer;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:7px 14px;font-weight:600;transition:background .1s,border-color .1s,color .1s}
button:hover{background:var(--soft)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--btn-bg);color:var(--btn-fg);border:0;font-weight:700;text-shadow:0 1px 1px rgba(0,0,0,.08);box-shadow:0 3px 10px var(--glow-2),inset 0 1px 0 rgba(255,255,255,.25);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px}
.primary:hover{background:var(--btn-bg-hover)}
.outline{background:transparent;border:1px solid var(--accent);color:var(--accent-text);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.outline:hover{background:var(--accent-soft)}
.textbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:700;display:inline-flex;align-items:center;gap:3px}
.textbtn:hover{background:none;text-decoration:underline;text-underline-offset:3px}
.textbtn svg{width:15px;height:15px}
.iconbtn{border:0;background:transparent;padding:6px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--soft);color:var(--text)}
.iconbtn.del:hover{color:var(--err)}
.danger{color:var(--err);border-color:var(--err);background:transparent;font-weight:700}
.danger:hover{background:var(--warn-soft)}

/* 위쪽: 상단 띠 + 머리 띠(잔물결) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--sun),var(--head-bg)}
.tb-in{max-width:1280px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.brand .bx{width:29px;height:29px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand .bx svg{width:18px;height:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0}
.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--glass)}
.tabs button.on{background:var(--nav-on);color:var(--accent-text);font-weight:800;box-shadow:0 2px 8px var(--glow)}
.tabs .cnt{font-size:11.5px;font-weight:800;background:var(--accent);color:var(--btn-fg);border-radius:999px;padding:0 7px;line-height:18px}
.tabs .cnt.mute{background:var(--soft-2);color:var(--muted)}
.pal{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--glass-2);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--text-2);flex:none}
.pal button{width:16px;height:16px;border-radius:50%;padding:0;border:0;background:var(--dot)}
.pal button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.hero{background:var(--wave) bottom/100% 20px no-repeat,var(--sun),var(--head-bg);padding:10px 0 38px}
.hero-in{max-width:1280px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:14px;position:relative}
/* 머리 띠 그림: 사용자가 고른 그림(docs/img/picnic.jpg). 고른 색감이 비치도록 반투명, 잔물결은 그림 위 */
/* 그림 액자: 원본 비율(3:2) 그대로 오른쪽에 — 배경으로 깔면 납작한 띠에 잘려 보이던 문제 */
.hero-in.withpic{display:block}
.hero.pic .hero-main{max-width:640px}
/* 그림 풍경: 머리 띠 오른쪽 위·오른쪽·아래 끝까지 닿고, 왼쪽(제목 쪽)과 아래(잔물결)로 길게 사라진다 → 액자 경계 없음 */
.hero-scene{display:none;position:absolute;top:0;right:0;bottom:0;width:min(60%,920px);background:var(--pic) 50% 58%/cover no-repeat;z-index:1;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 18%,rgba(0,0,0,.85) 40%,#000 55%),linear-gradient(180deg,rgba(0,0,0,.75) 0%,#000 14%,#000 72%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.35) 18%,rgba(0,0,0,.85) 40%,#000 55%),linear-gradient(180deg,rgba(0,0,0,.75) 0%,#000 14%,#000 72%,transparent 100%);
          mask-composite:intersect}
.hero.pic .hero-scene{display:block}
.hero-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-pic{display:none;margin:0;width:560px;max-width:100%;aspect-ratio:3/2;
  /* 가장자리를 흐려 배경에 녹아들게 (테두리·그림자 없음) */
  /* 네 변이 모두 서서히 사라지게: 가로·세로 흐림을 겹쳐(교집합) 네모 경계를 없앤다 */
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 86%,transparent 100%),linear-gradient(180deg,transparent 0%,#000 16%,#000 82%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(90deg,transparent 0%,#000 22%,#000 86%,transparent 100%),linear-gradient(180deg,transparent 0%,#000 16%,#000 82%,transparent 100%);
          mask-composite:intersect}
.hero-pic img{width:100%;height:100%;object-fit:cover;display:block}
.hero.pic .hero-pic{display:block}
/* 같은 그림을 머리 띠 전체에 아주 흐리게 깔아 숲·하늘 색이 배경으로 번지게. 제목 쪽(왼쪽)은 원래 색감이 남도록 옅게 */
.hero{position:relative;overflow:hidden}
.hero.pic::before{content:"";position:absolute;inset:-40px;background:var(--pic) 75% 55%/cover no-repeat;filter:blur(34px) saturate(1.2);opacity:.6;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 40%,#000 70%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.45) 40%,#000 70%)}
.hero.pic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--wave) bottom/100% 20px no-repeat;z-index:2}
.hero.pic{min-height:450px;display:flex;align-items:center}.hero.pic .hero-in{width:100%}
.hero-in{z-index:3}

@media (max-width:1100px){.hero-pic{width:420px}}
@media (max-width:960px){.hero-pic{width:340px}}
@media (max-width:860px){.hero-scene{width:100%;bottom:auto;height:240px;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
  .hero.pic .hero-in{padding-top:190px}.hero.pic{min-height:0}}
.pal .pic-tg{width:auto;height:auto;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;background:var(--bg);color:var(--text-2);border:1px solid var(--line-2);margin-left:4px}
.pal .pic-tg[aria-pressed="true"]{background:var(--accent);color:var(--btn-fg);border-color:var(--accent)}
.hero h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent-text)}
.hero .sub{font-size:13.5px;color:var(--text-2);margin-top:2px}
.search{height:50px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid rgba(255,255,255,.95);border-radius:12px;padding:0 10px 0 16px;box-shadow:0 3px 14px var(--glow);transition:box-shadow .15s,border-color .15s;max-width:820px}
.search:focus-within{border-color:var(--accent);box-shadow:0 3px 18px var(--glow-2)}
.search svg{width:20px;height:20px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16.5px;font-weight:600;height:100%}
.search input::placeholder{font-size:15px;font-weight:400;color:var(--muted)}
.search .clr{width:24px;height:24px;border-radius:50%;padding:0;border:0;background:var(--soft-2);display:grid;place-items:center;color:var(--text-2)}
.search .clr svg{width:13px;height:13px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;gap:2px;background:var(--glass);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.seg button:hover{background:var(--glass)}
.seg button.on{background:var(--bg);color:var(--accent-text);font-weight:800;box-shadow:0 1px 3px rgba(40,40,80,.14)}
.page .seg{background:var(--soft)}
.fbtn{height:36px;display:inline-flex;align-items:center;gap:6px;background:var(--glass-2);border:1px solid transparent;border-radius:10px;padding:0 12px;font-size:13px;font-weight:600;color:var(--text-2)}
.fbtn:hover{background:var(--bg)}
.fbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.fmore{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}

/* 본문 */
.page{max-width:1280px;margin:0 auto;padding:22px 28px 64px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em}
.sec-h .n{font-size:13px;font-weight:700;color:var(--muted)}
.sec-h .hint{font-size:12.5px;color:var(--muted)}
.sec-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.listbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.listbar select{margin-left:auto;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:6px 10px;font-weight:600;color:var(--text-2);cursor:pointer}
.grp{font-size:12.5px;font-weight:800;color:var(--muted);padding:10px 2px 0;display:flex;gap:6px;align-items:baseline}
.grp span{font-weight:500}

/* 공고 줄(카드) */
.rows{display:flex;flex-direction:column;gap:8px}
.jc{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;min-width:0;transition:border-color .1s,box-shadow .15s}
.jc:hover{border-color:var(--line-2);box-shadow:0 4px 16px var(--glow)}
.jc.pass{opacity:.5}
.jc.sel{background:var(--sel-bg);border-color:var(--line-2)}
.jc.sel::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sel-bar)}
.av{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;letter-spacing:-.04em}
.av.r1{background:var(--accent-soft-2);color:var(--accent-text)}
.av.r0{background:var(--btn-bg);color:var(--btn-fg);box-shadow:0 3px 10px var(--glow-2)}
.jc.top{border-color:var(--accent-soft-2);background:linear-gradient(90deg,var(--soft) 0%,var(--bg) 55%)}
.jc.top::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:5px;border-radius:14px 0 0 14px;background:var(--sel-bar)}
.jc.top .jc-ti{font-size:16.5px}
/* 새로 뜬 공고: 지난번 방문 이후 처음 수집된 공고 */
.jc.fresh{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 18px var(--glow-2)}
.jc.fresh .jc-ti::before{content:"NEW";display:inline-block;margin-right:7px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:800;line-height:18px;vertical-align:2px;background:var(--btn-bg);color:var(--btn-fg)}
.newbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.newbar b{font-size:15px}.newbar .sp{flex:1}
.seg.prof{display:inline-flex;flex-wrap:nowrap;flex-shrink:0}
.seg.prof .dot{display:inline-block;min-width:16px;margin-left:4px;padding:0 4px;border-radius:8px;font-size:10.5px;line-height:16px;background:var(--accent);color:var(--btn-fg)}
.jc.top .jc-co b{color:var(--accent-text)}
.grp.top{color:var(--accent-text);font-size:14px}
.grp.top::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sel-bar);align-self:center}
.ev.top{font-weight:800;box-shadow:inset 3px 0 0 var(--accent)}
.jc.top.sel{background:var(--sel-bg)}
.jc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.jc-co{font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-co b{color:var(--text);font-weight:800}
.jc-ti{font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.period{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.period svg{width:15px;height:15px;color:var(--accent-text)}
.period .sep{color:var(--muted);font-weight:500}
.period .lbl{font-weight:500;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:12px;color:var(--text-2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.lnk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--accent-text);text-decoration:none;border-radius:6px;padding:1px 0;max-width:100%}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.lnk svg{width:14px;height:14px}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.qk{display:flex;gap:4px;align-items:center}
.qk button{padding:2px 9px;font-size:12px;border-radius:7px}
.qk button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.qk .iconbtn{padding:4px}
.qk .iconbtn svg{width:16px;height:16px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.dd{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;background:var(--soft-2);color:var(--text-2)}
.dd.hot{background:var(--warn-soft);color:var(--warn)}
.dd.soon{background:var(--accent-soft);color:var(--accent-text)}
.dd.gone{text-decoration:line-through;opacity:.6}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.st.new{background:var(--accent);color:var(--btn-fg)}
.st.new.seen{background:var(--soft-2);color:var(--muted)}
.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.no{background:var(--soft-2);color:var(--muted)}
.st.win{background:var(--accent);color:var(--btn-fg)}
.st.ok{background:transparent;color:var(--ok);padding-left:0}
.st.up{background:var(--accent);color:var(--btn-fg)}
.pbox b.up{color:var(--ok)} .pbox b.down{color:var(--muted)}
.vline{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--text-2);background:var(--soft);border:1px solid var(--line)}
.vline b{font-size:13px}
.vline.ok b{color:var(--ok)}
.vline.no b{color:var(--muted)}
.vline.warn{background:var(--warn-soft);border-color:transparent}
.vline.warn b{color:var(--warn)}
.quote{display:block;quotes:"“" "”";font-style:normal;color:var(--text);background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;padding:6px 10px;margin-top:4px}
.quote::before{content:open-quote}.quote::after{content:close-quote}

/* 오른쪽 상자 */
.box{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px}
.box h3 small{font-size:12px;font-weight:500;color:var(--muted)}
.box h3 .textbtn{margin-left:auto;font-size:12.5px}
.pipe{display:flex;flex-direction:column;gap:6px}
.pipe button{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2em;align-items:center;gap:10px;border:0;background:transparent;padding:4px 2px;border-radius:8px;font-size:13px;text-align:left}
.pipe button:hover{background:var(--glass)}
.pipe .bar{height:8px;border-radius:4px;background:var(--soft-2);overflow:hidden}
.pipe .bar i{display:block;height:100%;background:var(--sel-bar)}
.pipe b{text-align:right;font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--soft-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sel-bar);width:0}
.big{font-size:22px;font-weight:800;color:var(--accent-text);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:12.5px}

/* 달력 */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar h2{margin:0 6px;font-size:20px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:7.5em;text-align:center}
.calbar .iconbtn{border:1px solid var(--line-2);background:var(--bg);width:34px;height:34px}
.calbar .seg{margin-left:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--band-bg);font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:7px 0}
.cal .wd.sun,.day.sun .dn{color:var(--err)}
.day{background:var(--bg);min-height:118px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;border:0;border-radius:0;text-align:left;font-weight:500}
.day:hover{background:var(--soft)}
.day.out{background:var(--soft);opacity:.55}
.day.pick{background:var(--sel-bg)}
.day .dn{font-size:12.5px;font-weight:800;color:var(--text-2);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.day.today .dn b{background:var(--accent);color:var(--btn-fg);border-radius:999px;padding:0 7px}
.day .dn small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.ev{display:block;width:100%;border:0;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--accent-soft);color:var(--accent-text)}
.ev:hover{background:var(--accent-soft-2)}
.ev.hot{background:var(--warn-soft);color:var(--warn)}
.ev.mine{background:var(--btn-bg);color:var(--btn-fg)}
.ev.pass{opacity:.5}
.ev.closed{background:var(--soft-2);color:var(--muted);text-decoration:line-through}
.more{border:0;background:none;padding:0 4px;font-size:11.5px;font-weight:700;color:var(--muted);text-align:left}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dots i.hot{background:var(--warn)} .dots i.mine{background:var(--accent-text)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--accent-soft)}
.legend i.hot{background:var(--warn-soft)} .legend i.mine{background:var(--btn-bg)}

/* 내 지원 보드 */

// ---------- 열쇠·복호화 (tools/seal.py 와 같은 형식: OpenSSL enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256)
function getKey(){const hp=new URLSearchParams(location.hash.slice(1));let k=hp.get("k");
  if(k){try{localStorage.setItem("jr-key",k)}catch(e){}hp.delete("k");history.replaceState(null,"",location.pathname+location.search+(hp.toString()?"#"+hp:""))} // 주소창에서 열쇠를 지운다
  else{try{k=localStorage.getItem("jr-key")}catch(e){}}
  return k}
async function openData(key){
  const r=await fetch("data/jobs.enc",{cache:"no-cache"});if(!r.ok)throw new Error("데이터 "+r.status);
  const b=new Uint8Array(await r.arrayBuffer());if(new TextDecoder().decode(b.slice(0,8))!=="Salted__")throw new Error("형식");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b.slice(8,16),iterations:100000},base,384));
  const k=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
  let pt;try{pt=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},k,b.slice(16))}
  catch(e){try{localStorage.removeItem("jr-key")}catch(_){}throw new Error("열쇠가 맞지 않아요 — 받은 링크로 다시 열어 주세요")}
  return JSON.parse(new TextDecoder().decode(pt))}
// ---------- 저장소: 공고는 같은 폴더의 data/jobs.enc(매일 자동 수집), 내 표시·메모·자소서는 이 브라우저에만 저장
const LKEY=p=>"jr:"+p;
function readL(path){try{return JSON.parse(localStorage.getItem(LKEY(path))||"null")}catch(e){return null}}
function ldoc(path){return{
  set:async v=>{localStorage.setItem(LKEY(path),JSON.stringify(v))}, // 용량 초과 등은 예외 → 기존 '저장 실패' 안내
  onSnapshot(cb){const v=readL(path);cb({exists:v!=null,data:()=>v});return()=>{}}}}
const localDb={doc:ldoc,collection:p=>({doc:k=>ldoc(p+"/"+k)})};
function loadMarks(){const d=readL("data/users/me/marks")||{};const{m,c,stage,memo,seen,trash,gone,...rest}=d;
  S.raw=rest;S.marks=m||{};S.checks=c||{};S.stage=stage||{};S.memo=memo||{};S.seen=seen||{};S.trash=trash||{};S.gone=gone||{}}
(async()=>{
  S.db=localDb;S.uid="me";loadMarks();S.ready=true;
  // 링크를 받은 사람만: 공고 데이터는 암호문(data/jobs.enc), 열쇠는 링크의 # 뒤 k=… (서버로 전송되지 않음) → 이 브라우저에 기억
  const key=getKey();
  if(!key){S.loaded=true;render();$("page").replaceChildren(emptyBox("radar","받은 링크로 열어 주세요","이 페이지는 공유받은 링크로만 볼 수 있어요. 처음 받은 링크(끝에 #k=… 가 붙은 주소)를 한 번 열면 그다음부터는 이 브라우저에서 바로 열려요."));$("h1sub").textContent="열쇠 없음";return}
  try{const d=await openData(key);
    S.all=(d.jobs||[]).map(j=>({_id:j.id,...j}));S.meta=d.meta||null;initSince();moveAliasMarks();applyProf()}
  catch(e){S.loaded=true;render();$("page").replaceChildren(emptyBox("radar","공고 데이터를 불러오지 못했어요",(e&&e.message&&/열쇠/.test(e.message))?e.message:"잠시 후 새로고침해 주세요. 계속 안 되면 수집이 멈췄을 수 있어요."));$("h1sub").textContent="연결 안 됨";return}
  S.loaded=true;render();
  addEventListener("storage",e=>{if(e.key===LKEY("data/users/me/marks")){loadMarks();render()}}); // 다른 탭에서 바꾼 표시
})();
</script>
